<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;background:#F4F6FA;color:#222;}

/* ── 헤더 ── */
.adm-header{background:#0C447C;color:white;padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.adm-header h1{font-size:16px;font-weight:700;letter-spacing:.3px;}
.adm-header span{font-size:12px;opacity:.7;}

/* ── 탭 ── */
.adm-tabs{display:flex;gap:0;background:white;border-bottom:2px solid #E5E9F0;padding:0 32px;position:sticky;top:60px;z-index:99;}
.adm-tab{padding:16px 24px;font-size:14px;font-weight:500;color:#888;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s;white-space:nowrap;}
.adm-tab.on{color:#0C447C;border-bottom-color:#0C447C;font-weight:700;}
.adm-tab:hover{color:#0C447C;}

/* ── 본문 ── */
.adm-body{max-width:1100px;margin:0 auto;padding:32px 24px 80px;}

.section-label{font-size:11px;font-weight:700;color:#888;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:16px;}

/* ── 현안 카드 ── */
.item-card{background:white;border-radius:14px;border:1px solid #E5E9F0;margin-bottom:16px;overflow:hidden;transition:.2s;}
.item-card:hover{border-color:#B5D4F4;}

/* ── 카드 헤더 ── */
.item-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid #F0F2F7;cursor:pointer;}
.item-head-left{display:flex;align-items:center;gap:14px;}
.item-color-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.item-head-title{font-size:15px;font-weight:600;color:#1a1a1a;}
.item-head-sub{font-size:12px;color:#888;margin-top:3px;}
.item-head-right{display:flex;align-items:center;gap:8px;}
.btn-toggle{background:none;border:none;color:#888;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:.15s;}
.btn-toggle:hover{background:#F4F6FA;}
.btn-delete{background:none;border:1px solid #FECACA;color:#DC2626;font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;transition:.2s;}
.btn-delete:hover{background:#FEF2F2;}

/* ── 카드 본문 (편집 영역) ── */
.item-body{display:none;padding:22px;}
.item-body.open{display:block;}

/* ── 필드 그룹 ── */
.field-group{margin-bottom:18px;}
.field-label{font-size:11.5px;font-weight:700;color:#555;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.field-label span{font-size:10px;color:#aaa;font-weight:400;}
.field-input{width:100%;padding:10px 14px;border:1.5px solid #E5E9F0;border-radius:8px;font-size:14px;color:#222;transition:.15s;font-family:inherit;}
.field-input:focus{outline:none;border-color:#185FA5;background:#FAFCFF;}
.field-textarea{width:100%;padding:10px 14px;border:1.5px solid #E5E9F0;border-radius:8px;font-size:14px;color:#222;resize:vertical;min-height:100px;transition:.15s;font-family:inherit;line-height:1.7;}
.field-textarea:focus{outline:none;border-color:#185FA5;background:#FAFCFF;}

/* ── 색상 선택 ── */
.color-picker-wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.color-btn{width:28px;height:28px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:.15s;flex-shrink:0;}
.color-btn.on{border-color:#0C447C;transform:scale(1.2);}
.color-custom{display:flex;align-items:center;gap:6px;font-size:12px;color:#888;}
.color-custom input[type="color"]{width:28px;height:28px;border:none;border-radius:50%;cursor:pointer;padding:0;}

/* ── 섹션 편집 ── */
.sections-editor{border:1px solid #E5E9F0;border-radius:10px;overflow:hidden;}
.sec-item{border-bottom:1px solid #F0F2F7;}
.sec-item:last-child{border-bottom:none;}
.sec-item-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#F8FAFF;}
.sec-title-input{flex:1;padding:7px 12px;border:1.5px solid #E5E9F0;border-radius:7px;font-size:13px;font-weight:600;color:#1a1a1a;font-family:inherit;}
.sec-title-input:focus{outline:none;border-color:#185FA5;}
.btn-sec-del{background:none;border:none;color:#DC2626;font-size:16px;cursor:pointer;padding:4px 8px;border-radius:6px;}
.btn-sec-del:hover{background:#FEF2F2;}
.sec-body-textarea{width:100%;padding:12px 16px;border:none;border-top:1px solid #F0F2F7;font-size:13.5px;color:#444;resize:vertical;min-height:80px;font-family:inherit;line-height:1.75;background:white;}
.sec-body-textarea:focus{outline:none;background:#FAFCFF;}

.btn-add-sec{width:100%;padding:10px;border:1.5px dashed #CBD5E1;border-radius:8px;background:none;color:#64748B;font-size:13px;cursor:pointer;margin-top:8px;transition:.2s;}
.btn-add-sec:hover{border-color:#185FA5;color:#185FA5;background:#F0F7FF;}

/* ── 저장 버튼 ── */
.btn-save{background:#0C447C;color:white;border:none;padding:11px 28px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:.2s;width:100%;margin-top:20px;}
.btn-save:hover{background:#185FA5;}
.btn-save:active{transform:scale(.98);}

/* ── 추가 버튼 ── */
.btn-add-item{width:100%;padding:16px;border:2px dashed #CBD5E1;border-radius:14px;background:white;color:#64748B;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;}
.btn-add-item:hover{border-color:#0C447C;color:#0C447C;background:#F0F7FF;}

/* ── 삭제 확인 모달 ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center;}
.modal-bg.on{display:flex;}
.modal-box{background:white;border-radius:16px;padding:32px;max-width:360px;width:90%;text-align:center;}
.modal-icon{font-size:36px;margin-bottom:12px;}
.modal-title{font-size:17px;font-weight:700;color:#1a1a1a;margin-bottom:8px;}
.modal-desc{font-size:13.5px;color:#666;line-height:1.6;margin-bottom:24px;}
.modal-btns{display:flex;gap:10px;}
.modal-btn-cancel{flex:1;padding:12px;border:1.5px solid #E5E9F0;border-radius:10px;background:white;font-size:14px;font-weight:600;color:#666;cursor:pointer;}
.modal-btn-cancel:hover{background:#F4F6FA;}
.modal-btn-confirm{flex:1;padding:12px;border:none;border-radius:10px;background:#DC2626;color:white;font-size:14px;font-weight:700;cursor:pointer;}
.modal-btn-confirm:hover{background:#B91C1C;}

/* ── 토스트 ── */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1a1a;color:white;padding:12px 24px;border-radius:30px;font-size:13.5px;font-weight:500;opacity:0;transition:.3s;pointer-events:none;z-index:9999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── 페이지별 숨김 ── */
.adm-page{display:none;}
.adm-page.on{display:block;}

/* ── 미리보기 배지 ── */
.preview-badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-left:8px;vertical-align:middle;}
</style>

function loadData() {
  try {
    var saved = localStorage.getItem('kkpa_admin_data');
    return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaultData));
  } catch(e) {
    return JSON.parse(JSON.stringify(defaultData));
  }
}

function saveData(data) {
  localStorage.setItem('kkpa_admin_data', JSON.stringify(data));
  showToast('✅ 저장됐습니다!');
}

var DATA = loadData();

function switchTab(page, el) {
  document.querySelectorAll('.adm-tab').forEach(function(t){ t.classList.remove('on'); });
  document.querySelectorAll('.adm-page').forEach(function(p){ p.classList.remove('on'); });
  el.classList.add('on');
  document.getElementById('page-' + page).classList.add('on');
}

var COLOR_PRESETS = [
  '#B91C1C','#C2410C','#D97706','#065F46','#1D4ED8','#5B21B6','#0C447C','#374151'
];

function colorPickerHTML(itemId, currentColor) {
  var html = '<div class="color-picker-wrap">';
  COLOR_PRESETS.forEach(function(c) {
    html += '<div class="color-btn' + (c === currentColor ? ' on' : '') + '" '
          + 'style="background:' + c + ';" '
          + 'onclick="selectColor(\'' + itemId + '\',\'' + c + '\',this)" title="' + c + '"></div>';
  });
  html += '<div class="color-custom"><input type="color" id="custom-color-' + itemId + '" value="' + currentColor + '" '
        + 'onchange="selectCustomColor(\'' + itemId + '\',this)"> 직접 선택</div>';
  html += '</div>';
  return html;
}

function selectColor(itemId, color, btn) {
  document.querySelectorAll('[data-color-id="' + itemId + '"] .color-btn').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  document.getElementById('custom-color-' + itemId).value = color;
}

function selectCustomColor(itemId, input) {
  document.querySelectorAll('[data-color-id="' + itemId + '"] .color-btn').forEach(function(b){ b.classList.remove('on'); });
}

function saveBriefingItem(idx) {
  var item = DATA.briefing[idx];

  // 1) 제목/부제/날짜 먼저 읽기
  item.title       = document.getElementById('b-title-'       + idx).value;
  item.cardDesc    = document.getElementById('b-carddesc-'    + idx).value;
  item.detailTitle = (document.getElementById('b-detailtitle-'+ idx).value) || item.title;
  item.subtitle    = document.getElementById('b-subtitle-'    + idx).value;
  item.date        = document.getElementById('b-date-'        + idx).value;

  // 2) 색상 읽기
  var activeDot = document.querySelector('[data-color-id="b' + idx + '"] .color-btn.on');
  if (activeDot) {
    item.color = activeDot.style.background;
  } else {
    var customEl = document.getElementById('custom-color-b' + idx);
    if (customEl) item.color = customEl.value;
  }

  // 3) 섹션 읽기 (DOM에서 직접 — 렌더 전에!)
  var newSections = [];
  var si = 0;
  while (true) {
    var titleEl = document.getElementById('sec-title-' + idx + '-' + si);
    var bodyEl  = document.getElementById('sec-body-'  + idx + '-' + si);
    if (!titleEl || !bodyEl) break;
    newSections.push({ title: titleEl.value, content: bodyEl.value });
    si++;
  }
  item.sections = newSections;

  // 4) 저장 후 렌더 (렌더가 DOM을 교체하기 전에 이미 값을 읽었음)
  saveData(DATA);
  applyToFront();

  // 5) 렌더 후 해당 카드 다시 열기
  renderBriefing();
  setTimeout(function(){
    var cards = document.querySelectorAll('#briefing-list .item-card');
    if (cards[idx]) {
      var body = cards[idx].querySelector('.item-body');
      if (body) body.classList.add('open');
      var btn = cards[idx].querySelector('.btn-toggle');
      if (btn) btn.textContent = '▴';
    }
  }, 10);
}

function addSection(idx) {
  DATA.briefing[idx].sections.push({title:'새 섹션', content:''});
  saveData(DATA);
  renderBriefing();
  // 해당 카드 다시 열기
  var cards = document.querySelectorAll('#briefing-list .item-card');
  if (cards[idx]) {
    var body = cards[idx].querySelector('.item-body');
    if (body) body.classList.add('open');
  }
}

function deleteSection(idx, si) {
  DATA.briefing[idx].sections.splice(si, 1);
  saveData(DATA);
  renderBriefing();
  var cards = document.querySelectorAll('#briefing-list .item-card');
  if (cards[idx]) {
    var body = cards[idx].querySelector('.item-body');
    if (body) body.classList.add('open');
  }
}

function buildOnairCard(item, idx) {
  var typeOptions = ['카드뉴스','쇼츠','포스터'].map(function(t){
    return '<option' + (item.type===t?' selected':'') + '>' + t + '</option>';
  }).join('');

  var secHtml = '';
  (item.sections||[]).forEach(function(sec, si) {
    secHtml +=
      '<div class="sec-item">'
      + '<div class="sec-item-head">'
      + '<input class="sec-title-input" value="' + esc(sec.title) + '" placeholder="소제목" id="osec-title-' + idx + '-' + si + '">'
      + '<button class="btn-sec-del" onclick="deleteOnairSection(' + idx + ',' + si + ')" title="이 섹션 삭제">✕</button>'
      + '</div>'
      + '<textarea class="sec-body-textarea" placeholder="내용을 입력하세요..." id="osec-body-' + idx + '-' + si + '">' + esc(sec.content) + '</textarea>'
      + '</div>';
  });

  return '<div class="item-head" onclick="toggleCard(this)">'
    + '<div class="item-head-left"><div>'
    + '<div class="item-head-title">' + esc(item.title) + ' <span style="font-size:11px;color:#888;font-weight:400;">[' + (item.type||'') + ']</span></div>'
    + '<div class="item-head-sub">' + esc(item.cardDesc||item.subtitle||'') + '</div>'
    + '</div></div>'
    + '<div class="item-head-right"><button class="btn-toggle">▾</button></div></div>'
    + '<div style="padding:8px 22px 0;text-align:right;">'
    + '<button class="btn-delete" onclick="openDeleteModal(\'onair\',' + idx + ')">➖ 이 콘텐츠 삭제</button>'
    + '</div>'
    + '<div class="item-body">'

    + '<div style="background:#F0F7FF;border-radius:10px;padding:16px;margin-bottom:16px;">'
    + '<div style="font-size:12px;font-weight:700;color:#0C447C;margin-bottom:12px;">📋 좌측 카드 목록</div>'
    + '<div class="field-group" style="margin-bottom:10px;"><div class="field-label">제목</div>'
    + '<input class="field-input" id="o-title-' + idx + '" value="' + esc(item.title) + '"></div>'
    + '<div class="field-group" style="margin-bottom:10px;"><div class="field-label">카드 요약 설명 <span>(한 줄)</span></div>'
    + '<input class="field-input" id="o-carddesc-' + idx + '" value="' + esc(item.cardDesc||item.subtitle||'') + '"></div>'
    + '<div style="display:flex;gap:12px;"><div class="field-group" style="flex:1;margin-bottom:0;"><div class="field-label">콘텐츠 유형</div>'
    + '<select class="field-input" id="o-type-' + idx + '" style="cursor:pointer;">' + typeOptions + '</select></div>'
    + '<div class="field-group" style="max-width:160px;margin-bottom:0;"><div class="field-label">날짜</div>'
    + '<input class="field-input" id="o-date-' + idx + '" value="' + esc(item.date) + '"></div></div>'
    + '</div>'

    + '<div style="background:#F8FFF8;border-radius:10px;padding:16px;margin-bottom:16px;">'
    + '<div style="font-size:12px;font-weight:700;color:#065F46;margin-bottom:12px;">📄 우측 상세 내용 헤더</div>'
    + '<div class="field-group" style="margin-bottom:10px;"><div class="field-label">상세 제목 <span>(비워두면 좌측 제목과 동일)</span></div>'
    + '<input class="field-input" id="o-detailtitle-' + idx + '" value="' + esc(item.detailTitle||item.title||'') + '"></div>'
    + '<div class="field-group" style="margin-bottom:10px;"><div class="field-label">상세 부제</div>'
    + '<input class="field-input" id="o-subtitle-' + idx + '" value="' + esc(item.subtitle||'') + '"></div>'
    + '<div class="field-group" style="margin-bottom:0;"><div class="field-label">이미지 URL <span>(비워두면 색상 placeholder)</span></div>'
    + '<input class="field-input" id="o-img-' + idx + '" value="' + esc(item.imageUrl||'') + '" placeholder="https://..."></div>'
    + '</div>'

    + '<div class="field-group"><div class="field-label" style="font-size:13px;color:#0C447C;margin-bottom:10px;">📝 상세 내용 섹션 편집 (소제목 + 본문)</div>'
    + '<div class="sections-editor">' + secHtml + '</div>'
    + '<button class="btn-add-sec" onclick="addOnairSection(' + idx + ')">＋ 섹션 추가</button>'
    + '</div>'

    + '<button class="btn-save" onclick="saveOnairItem(' + idx + ')">💾 저장</button>'
    + '</div>';
}

function saveOnairItem(idx) {
  var item = DATA.onair[idx];
  item.title       = document.getElementById('o-title-'       + idx).value;
  item.cardDesc    = document.getElementById('o-carddesc-'    + idx).value;
  item.detailTitle = document.getElementById('o-detailtitle-' + idx).value || item.title;
  item.subtitle    = document.getElementById('o-subtitle-'    + idx).value;
  item.type        = document.getElementById('o-type-'        + idx).value;
  item.date        = document.getElementById('o-date-'        + idx).value;
  item.imageUrl    = document.getElementById('o-img-'         + idx).value;
  var newSections = [];
  var si = 0;
  while (true) {
    var tEl = document.getElementById('osec-title-' + idx + '-' + si);
    var bEl = document.getElementById('osec-body-'  + idx + '-' + si);
    if (!tEl || !bEl) break;
    newSections.push({title: tEl.value, content: bEl.value});
    si++;
  }
  item.sections = newSections;
  saveData(DATA);
  applyToFront();
  renderOnair();
  renderOnairTrash();
  showToast('✅ 저장됐습니다!');
}

function addOnairSection(idx) {
  if (!DATA.onair[idx].sections) DATA.onair[idx].sections = [];
  DATA.onair[idx].sections.push({title:'새 섹션', content:''});
  saveData(DATA);
  renderOnair();
}

function deleteOnairSection(idx, si) {
  DATA.onair[idx].sections.splice(si, 1);
  saveData(DATA);
  renderOnair();
}

function addOnairItem() {
  DATA.onair.push({
    id: 'o_' + Date.now(),
    title: '새 콘텐츠',
    cardDesc: '설명을 입력하세요',
    detailTitle: '',
    subtitle: '',
    type: '카드뉴스',
    date: new Date().getFullYear() + '.' + String(new Date().getMonth()+1).padStart(2,'0'),
    imageUrl: '',
    sections: [{title:'📋 콘텐츠 소개', content:''}]
  });
  saveData(DATA);
  renderOnair();
  setTimeout(function(){
    var cards = document.querySelectorAll('#onair-list .item-card');
    var last = cards[cards.length-1];
    if (last) { last.querySelector('.item-body').classList.add('open'); last.scrollIntoView({behavior:'smooth'}); }
  }, 100);
}

// ══════════════════════════════════════════════════════════
// 카드 토글
// ══════════════════════════════════════════════════════════
function toggleCard(head) {
  var card = head.closest('.item-card');
  var body = card.querySelector('.item-body');
  var btn  = head.querySelector('.btn-toggle');
  body.classList.toggle('open');
  btn.textContent = body.classList.contains('open') ? '▴' : '▾';
}

// ══════════════════════════════════════════════════════════
// 삭제 모달
// ══════════════════════════════════════════════════════════
var _deleteTarget = null;

function openDeleteModal(type, idx) {
  var item = DATA[type] && DATA[type][idx];
  if (!item) { showToast('⚠️ 항목을 찾을 수 없습니다.'); return; }
  _deleteTarget = {type: type, idx: idx};
  document.getElementById('deleteModalDesc').textContent = '"' + item.title + '" 을(를) 휴지통으로 이동합니다. 나중에 복원할 수 있습니다.';
  document.getElementById('deleteModal').classList.add('on');
}

function closeDeleteModal() {
  document.getElementById('deleteModal').classList.remove('on');
  _deleteTarget = null;
}

function confirmDelete() {
  if (!_deleteTarget) return;
  var type = _deleteTarget.type;
  var idx  = _deleteTarget.idx;
  var name = DATA[type][idx].title;

  // 완전 삭제 대신 휴지통으로 이동
  DATA[type][idx]._deleted = true;
  saveData(DATA);
  applyToFront();

  if (type === 'briefing') { renderBriefing(); renderBriefingTrash(); }
  else if (type === 'health') { renderHealth(); renderHealthTrash(); }
  else { renderOnair(); renderOnairTrash(); }

  closeDeleteModal();
  showToast('🗑️ "' + name + '" 이(가) 휴지통으로 이동됐습니다. 복원 가능합니다.');
}

// ══════════════════════════════════════════════════════════
// 휴지통 렌더
// ══════════════════════════════════════════════════════════
function renderTrash(type, containerId) {
  var deleted = DATA[type].filter(function(item){ return item._deleted; });
  var container = document.getElementById(containerId);
  if (!container) return;
  if (!deleted.length) {
    container.innerHTML = '<p style="color:#aaa;font-size:13px;padding:12px 0;">삭제된 항목이 없습니다.</p>';
    return;
  }
  container.innerHTML = deleted.map(function(item){
    var realIdx = DATA[type].indexOf(item);
    return '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#FFF8F8;border:1px solid #FECACA;border-radius:10px;margin-bottom:8px;">'
      + '<div>'
      + '<div style="font-size:14px;font-weight:600;color:#666;">' + esc(item.title) + '</div>'
      + '<div style="font-size:12px;color:#aaa;margin-top:2px;">' + esc(item.subtitle||item.date||'') + '</div>'
      + '</div>'
      + '<div style="display:flex;gap:8px;">'
      + '<button onclick="restoreItem(\'' + type + '\',' + realIdx + ')" style="padding:6px 14px;border:1.5px solid #0C447C;border-radius:20px;background:white;color:#0C447C;font-size:12px;font-weight:700;cursor:pointer;">↩️ 복원</button>'
      + '<button onclick="permanentDelete(\'' + type + '\',' + realIdx + ')" style="padding:6px 14px;border:1.5px solid #DC2626;border-radius:20px;background:white;color:#DC2626;font-size:12px;font-weight:700;cursor:pointer;">완전 삭제</button>'
      + '</div></div>';
  }).join('');
}

function renderBriefingTrash(){ renderTrash('briefing','briefing-trash'); }
function renderHealthTrash(){ renderTrash('health','health-trash'); }
function renderOnairTrash(){ renderTrash('onair','onair-trash'); }

function restoreItem(type, idx) {
  delete DATA[type][idx]._deleted;
  saveData(DATA);
  applyToFront();
  if (type==='briefing'){ renderBriefing(); renderBriefingTrash(); }
  else if (type==='health'){ renderHealth(); renderHealthTrash(); }
  else { renderOnair(); renderOnairTrash(); }
  showToast('✅ 복원됐습니다!');
}

function permanentDelete(type, idx) {
  var name = DATA[type][idx].title;
  if (!confirm('"' + name + '" 을(를) 영구 삭제합니다. 되돌릴 수 없습니다.')) return;
  DATA[type].splice(idx, 1);
  saveData(DATA);
  applyToFront();
  if (type==='briefing'){ renderBriefing(); renderBriefingTrash(); }
  else if (type==='health'){ renderHealth(); renderHealthTrash(); }
  else { renderOnair(); renderOnairTrash(); }
  showToast('🗑️ 영구 삭제됐습니다.');
}

// ══════════════════════════════════════════════════════════
// 기본값으로 초기화
// ══════════════════════════════════════════════════════════
function resetToDefault() {
  if (!confirm('모든 데이터를 기본값으로 초기화합니다.\n지금까지 수정한 내용이 모두 사라집니다.\n계속하시겠습니까?')) return;
  localStorage.removeItem('kkpa_admin_data');
  localStorage.removeItem('kkpa_briefing');
  localStorage.removeItem('kkpa_health');
  localStorage.removeItem('kkpa_onair');
  DATA = JSON.parse(JSON.stringify(defaultData));
  renderBriefing();
  renderHealth();
  renderOnair();
  renderBriefingTrash();
  renderHealthTrash();
  renderOnairTrash();
  applyToFront();
  showToast('✅ 기본값으로 초기화됐습니다!');
}

// ══════════════════════════════════════════════════════════
// 프론트 페이지 반영 (localStorage → 각 페이지에서 읽어감)
// ══════════════════════════════════════════════════════════
function applyToFront() {
  localStorage.setItem('kkpa_briefing', JSON.stringify(DATA.briefing));
  localStorage.setItem('kkpa_health',   JSON.stringify(DATA.health));
  localStorage.setItem('kkpa_onair',    JSON.stringify(DATA.onair));
}

// ══════════════════════════════════════════════════════════
// 토스트
// ══════════════════════════════════════════════════════════
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

// ══════════════════════════════════════════════════════════
// HTML 이스케이프
// ══════════════════════════════════════════════════════════
function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ══════════════════════════════════════════════════════════
// 초기 렌더
// ══════════════════════════════════════════════════════════
renderBriefing();
renderHealth();
renderOnair();
renderBriefingTrash();
renderHealthTrash();
renderOnairTrash();
</script>
</body>
</html>
